<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Playful Blue Stream Overlay Bar - Tall & Eye Friendly</title>
  <!-- Custom Font Chunky & Playful -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@700;800&family=Titan+One&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: transparent;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding-bottom: 24px;
      font-family: 'Titan One', 'Fredoka', sans-serif;
    }

    /* Container Utama (Ditinggikan) */
    .overlay-container {
      position: relative;
      width: 1140px;
      height: 180px;
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }

    /* Tinggi Bar Dinaikkan dari 96px ke 135px */
    .bar-outer {
      position: relative;
      width: 100%;
      height: 135px;
    }

    /* =========================================================================
       GARIS ATAS (TOP RIBBON): CHEERFUL PASTEL, ANTI-PUSING & NYAMAN DI MATA
       ========================================================================= */
    .top-playful-ribbon {
      position: absolute;
      top: -12px;
      left: 0;
      width: 100%;
      height: 16px;
      z-index: 12;
      border-radius: 8px 8px 0 0;
      border-top: 3px solid #ffffff;
      border-bottom: 3px solid #1660cf;
      border-left: 3px solid #ffffff;
      border-right: 3px solid #ffffff;
      overflow: hidden;
      box-shadow: 0 3px 8px rgba(10, 50, 115, 0.25);
      /* Garis diagonal lebar dengan warna pastel lembut & statis (tidak bikin pusing) */
      background: repeating-linear-gradient(
        -45deg,
        #7ec4ff 0px,
        #7ec4ff 22px,
        #a6daff 22px,
        #a6daff 44px
      );
      display: flex;
      align-items: center;
      justify-content: space-evenly;
    }

    /* Kilau lembut di bagian atas pita */
    .top-playful-ribbon::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 4px;
      background: rgba(255, 255, 255, 0.55);
      pointer-events: none;
    }

    /* Garis Vertikal Playful (Berbentuk kapsul/pill bulat berjarak renggang) */
    .vertical-pill {
      position: relative;
      width: 5px;
      height: 10px;
      background: #ffffff;
      border-radius: 4px;
      box-shadow: 0 0 0 2px #2c82f7;
      z-index: 2;
    }

    .vertical-pill.alt {
      height: 7px;
      background: #d8f0ff;
      box-shadow: 0 0 0 1.5px #4595ff;
    }

    /* Bar Biru Utama (Lebih Tinggi & Lega) */
    .stream-bar {
      position: relative;
      width: 100%;
      height: 100%;
      background: linear-gradient(180deg, #1167e6 0%, #2987f8 50%, #52acff 100%);
      border-bottom: 4px solid #0a3d8a;
      border-left: 3px solid rgba(255, 255, 255, 0.65);
      border-right: 3px solid rgba(255, 255, 255, 0.65);
      border-radius: 0 0 8px 8px;
      box-shadow: 
        0 10px 25px rgba(8, 42, 98, 0.45),
        inset 0 0 22px rgba(255, 255, 255, 0.35);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* 1. CANVAS 3D TRAPEZOID GRID (LEBIH RENGGANG & LEMBUT DI MATA) */
    #gridCanvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
    }

    /* 2. CANVAS BINTANG JATUH DIAGONAL SEARAH (SAAT WAKTU TANPA AWAN) */
    #meteorCanvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      pointer-events: none;
    }

    /* 3. LAYER AWAN DARI UJUNG KE UJUNG (3 LAYER DARI GELAP KE TERANG) */
    .clouds-layer {
      position: absolute;
      inset: 0;
      z-index: 3;
      pointer-events: none;
      overflow: hidden;
      transform: translateY(0%);
      opacity: 1;
      transition: transform 1s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.85s ease;
    }

    .clouds-layer.clouds-hidden {
      transform: translateY(105%);
      opacity: 0;
    }

    .cloud-strip {
      position: absolute;
      bottom: -4px;
      left: 0;
      width: 2280px; /* 2x lebar bar (1140px * 2) */
      height: 135px;
      display: flex;
      will-change: transform;
    }

    .cloud-strip svg {
      width: 1140px;
      height: 135px;
      flex-shrink: 0;
    }

    /* Layer 1 (Belakang - Biru Gelap) */
    .cloud-strip.layer-dark {
      bottom: 0px;
      opacity: 0.9;
      animation: cloudScrollLeft 18s linear infinite;
    }

    /* Layer 2 (Tengah - Biru Muda) */
    .cloud-strip.layer-mid {
      bottom: -2px;
      opacity: 0.95;
      animation: cloudScrollLeft 13s linear infinite;
    }

    /* Layer 3 (Depan - Putih Besar) */
    .cloud-strip.layer-light {
      bottom: -4px;
      opacity: 1;
      filter: drop-shadow(0 -3px 5px rgba(14, 75, 168, 0.16));
      animation: cloudScrollLeft 9.5s linear infinite;
    }

    @keyframes cloudScrollLeft {
      0% { transform: translateX(0); }
      100% { transform: translateX(-1140px); }
    }

    /* 4. LAYER FLAKES (PARTIKEL PLAYFUL) */
    .flakes-layer {
      position: absolute;
      inset: 0;
      z-index: 4;
      pointer-events: none;
      overflow: hidden;
    }

    .flake-item {
      position: absolute;
      bottom: -18px;
      will-change: transform, opacity;
      animation: flakeFloatUp linear infinite;
    }

    .flake-dark-square {
      width: 7px;
      height: 7px;
      background: rgba(9, 44, 104, 0.55);
      border-radius: 1.5px;
    }

    .flake-light-square {
      width: 6px;
      height: 6px;
      background: rgba(255, 255, 255, 0.88);
      box-shadow: 0 0 6px rgba(255, 255, 255, 0.8);
      border-radius: 1.5px;
    }

    .flake-diamond {
      width: 8px;
      height: 8px;
      background: rgba(195, 238, 255, 0.85);
      transform: rotate(45deg);
      box-shadow: 0 0 4px rgba(255, 255, 255, 0.6);
    }

    .flake-cross {
      width: 9px;
      height: 9px;
      position: relative;
    }
    .flake-cross::before,
    .flake-cross::after {
      content: '';
      position: absolute;
      background: rgba(255, 255, 255, 0.85);
      border-radius: 1px;
    }
    .flake-cross::before {
      top: 3px; left: 0; width: 9px; height: 3px;
    }
    .flake-cross::after {
      top: 0; left: 3px; width: 3px; height: 9px;
    }

    @keyframes flakeFloatUp {
      0% {
        transform: translateY(15px) translateX(0px) rotate(0deg);
        opacity: 0;
      }
      15% { opacity: 1; }
      50% {
        transform: translateY(-65px) translateX(10px) rotate(90deg);
      }
      85% { opacity: 1; }
      100% {
        transform: translateY(-145px) translateX(-8px) rotate(180deg);
        opacity: 0;
      }
    }

    /* 5. SHINE SWEEP & SPARKLES */
    .shine-bar {
      position: absolute;
      top: 0;
      left: -130%;
      width: 42%;
      height: 100%;
      background: linear-gradient(
        115deg,
        transparent 0%,
        rgba(255, 255, 255, 0.05) 35%,
        rgba(255, 255, 255, 0.35) 50%,
        rgba(255, 255, 255, 0.05) 65%,
        transparent 100%
      );
      z-index: 5;
      pointer-events: none;
      animation: shineSweep 6s ease-in-out infinite;
    }

    @keyframes shineSweep {
      0% { left: -130%; }
      45%, 100% { left: 145%; }
    }

    .sparkle {
      position: absolute;
      z-index: 6;
      pointer-events: none;
      animation: sparkleTwinkle 1.8s ease-in-out infinite;
    }

    @keyframes sparkleTwinkle {
      0%, 100% { transform: scale(0) rotate(0deg); opacity: 0; }
      50% { transform: scale(1.15) rotate(45deg); opacity: 1; }
    }

    /* =========================================================================
       6. BINTANG PASTEL BIRU CHUBBY DI GARIS ATAS (SESUAI REFERENSI)
       ========================================================================= */
    .video-star-track {
      position: absolute;
      top: -26px;
      left: 0;
      width: 100%;
      height: 52px;
      z-index: 20;
      pointer-events: none;
      overflow: visible;
    }

    .video-star-mover {
      position: absolute;
      top: 2px;
      left: 0;
      width: 42px;
      height: 42px;
      animation: starCruiseRightToLeft 12.5s linear infinite;
    }

    .video-star-bob {
      width: 100%;
      height: 100%;
      animation: starBobAndTilt 1.2s ease-in-out infinite alternate;
    }

    .video-star-bob svg {
      width: 100%;
      height: 100%;
      overflow: visible;
      filter: 
        drop-shadow(0 2px 5px rgba(25, 65, 130, 0.6))
        drop-shadow(0 0 6px rgba(120, 185, 255, 0.55));
    }

    @keyframes starCruiseRightToLeft {
      0% {
        transform: translateX(1085px);
        opacity: 0;
      }
      4% { opacity: 1; }
      94% { opacity: 1; }
      100% {
        transform: translateX(-25px);
        opacity: 0;
      }
    }

    @keyframes starBobAndTilt {
      0% {
        transform: translateY(-2px) rotate(-10deg) scale(0.97);
      }
      100% {
        transform: translateY(6px) rotate(10deg) scale(1.04);
      }
    }

    /* 7. TEKS UTAMA (DI TENGAH BAR YANG SUDAH DITINGGIKAN) */
    .content-row {
      position: relative;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      padding: 6px 36px 0 36px;
      overflow: hidden;
    }

    .text-stage {
      display: flex;
      align-items: center;
      justify-content: center;
      white-space: nowrap;
      gap: 12px;
      padding: 10px 4px;
    }

    .word {
      display: inline-flex;
    }

    .char {
      display: inline-block;
      font-size: 40px;
      color: #ffffff;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      -webkit-text-stroke: 7px #1453b3;
      paint-order: stroke fill;
      filter: drop-shadow(0px 5px 0px #0a3578);
      will-change: transform;
    }

    .char.pop-in {
      animation: charSlideUp 0.36s cubic-bezier(0.22, 1.38, 0.48, 1) both;
    }

    .char.pop-out {
      animation: charSlideDown 0.26s cubic-bezier(0.55, 0.06, 0.68, 0.19) both;
    }

    @keyframes charSlideUp {
      0% { transform: translateY(105px); }
      70% { transform: translateY(-5px); }
      100% { transform: translateY(0px); }
    }

    @keyframes charSlideDown {
      0% { transform: translateY(0px); }
      100% { transform: translateY(105px); }
    }
  </style>
</head>
<body>

  <div class="overlay-container">
    <div class="bar-outer">

      <!-- GARIS ATAS (TOP RIBBON): PASTEL DIAGONAL + AKSEN VERTIKAL PILL CERIA -->
      <div class="top-playful-ribbon" id="topRibbon"></div>

      <!-- BINTANG PASTEL BIRU CHUBBY DI GARIS ATAS -->
      <div class="video-star-track">
        <div class="video-star-mover">
          <div class="video-star-bob">
            <svg viewBox="0 0 100 100">
              <defs>
                <path id="chubbyStarPath" d="M 50,10 L 61,33 L 86,37 L 68,55 L 72,80 L 50,68 L 28,80 L 32,55 L 14,37 L 39,33 Z" />
                <clipPath id="innerStarClip">
                  <path d="M 50,15 L 59.5,35 L 81,38.5 L 65.5,54 L 69,75.5 L 50,65 L 31,75.5 L 34.5,54 L 19,38.5 L 40.5,35 Z" stroke-linejoin="round" />
                </clipPath>
                <linearGradient id="pastelBlueFill" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stop-color="#b8dcff" />
                  <stop offset="50%" stop-color="#d4ebff" />
                  <stop offset="100%" stop-color="#b0d7ff" />
                </linearGradient>
              </defs>

              <!-- 1. Outer Border Biru Langit Muda -->
              <use href="#chubbyStarPath" fill="#8ec5ff" stroke="#8ec5ff" stroke-width="18" stroke-linejoin="round" stroke-linecap="round" />
              <!-- 2. Middle Border Putih Tebal -->
              <use href="#chubbyStarPath" fill="#ffffff" stroke="#ffffff" stroke-width="11" stroke-linejoin="round" stroke-linecap="round" />
              <!-- 3. Inner Body Biru Pastel -->
              <use href="#chubbyStarPath" fill="url(#pastelBlueFill)" stroke="url(#pastelBlueFill)" stroke-width="2" stroke-linejoin="round" />

              <!-- 4. Detail Dalam Bintang: Garis Kilau Diagonal & Bintang Kecil -->
              <g clip-path="url(#innerStarClip)">
                <rect x="-10" y="38" width="120" height="14" fill="rgba(255, 255, 255, 0.52)" transform="rotate(-42 50 50)" />
                <rect x="-10" y="60" width="120" height="6" fill="rgba(255, 255, 255, 0.45)" transform="rotate(-42 50 50)" />
                <polygon points="48,24 49.5,28 54,28.5 50.5,31 51.5,35 48,32.8 44.5,35 45.5,31 42,28.5 46.5,28" fill="#ffffff" opacity="0.95" />
                <polygon points="62,53 63.8,57.5 68.5,58 65,61 66,65.5 62,63 58,65.5 59,61 55.5,58 60.2,57.5" fill="#ffffff" opacity="0.95" />
                <polygon points="33,43 34,46 37,46.5 34.8,48.5 35.5,51.5 33,49.8 30.5,51.5 31.2,48.5 29,46.5 32,46" fill="#ffffff" opacity="0.9" />
                <polygon points="52,60 53,62.5 55.5,63 53.5,64.8 54,67.5 52,66 50,67.5 50.5,64.8 48.5,63 51,62.5" fill="#ffffff" opacity="0.9" />
                <circle cx="43" cy="48" r="1.8" fill="#ffffff" opacity="0.9" />
                <circle cx="57" cy="41" r="1.5" fill="#ffffff" opacity="0.85" />
                <circle cx="38" cy="61" r="1.6" fill="#ffffff" opacity="0.85" />
                <circle cx="67" cy="45" r="2.0" fill="#ffffff" opacity="0.9" />
              </g>
            </svg>
          </div>
        </div>
      </div>

      <!-- BAR BIRU UTAMA (TINGGI 135PX) -->
      <div class="stream-bar" id="streamBar">
        
        <!-- 1. Canvas 3D Trapezoid Grid (Lebih Renggang & Nyaman di Mata) -->
        <canvas id="gridCanvas" width="1140" height="135"></canvas>

        <!-- 2. Canvas Bintang Jatuh Diagonal Searah (Muncul Saat Tanpa Awan) -->
        <canvas id="meteorCanvas" width="1140" height="135"></canvas>

        <!-- 3. Awan Ujung ke Ujung (3 Layer dari Gelap ke Terang, Proporsional dengan Bar Tinggi) -->
        <div class="clouds-layer" id="cloudsLayer"></div>

        <!-- 4. Layer Flakes -->
        <div class="flakes-layer" id="flakesLayer"></div>

        <!-- 5. Shine Sweep -->
        <div class="shine-bar"></div>

        <!-- 6. Stage Teks Utama -->
        <div class="content-row">
          <div class="text-stage" id="textStage"></div>
        </div>

      </div>
    </div>
  </div>

  <script>
    /* =========================================================================
       0. GENERATE AKSEN GARIS VERTIKAL PILL CERIA DI PITA ATAS
       ========================================================================= */
    const topRibbon = document.getElementById("topRibbon");
    for (let i = 0; i < 18; i++) {
      const pill = document.createElement("div");
      pill.className = "vertical-pill" + (i % 2 === 1 ? " alt" : "");
      topRibbon.appendChild(pill);
    }

    /* =========================================================================
       1. RENDER 3D TRAPEZOID GRID (LEBIH RENGGANG, KALEM & NYAMAN DI MATA)
       ========================================================================= */
    const canvas = document.getElementById("gridCanvas");
    const ctx = canvas.getContext("2d");
    const W = canvas.width;
    const H = canvas.height;

    let gridOffset = 0;
    const gridSpeed = 0.0055; // Gerak ke atas lebih kalem agar tidak bikin mata lelah

    function drawTrapezoidGrid() {
      ctx.clearRect(0, 0, W, H);

      ctx.strokeStyle = "rgba(255, 255, 255, 0.24)";
      ctx.lineWidth = 1.6;

      // Kolom vertikal dibuat lebih renggang (16 kolom, sebelumnya 26)
      const numCols = 16;
      const topSpread = W * 0.74;
      const bottomSpread = W * 1.38;

      for (let i = -1; i <= numCols + 1; i++) {
        const norm = (i / numCols) - 0.5;
        const xTop = (W / 2) + norm * topSpread;
        const xBottom = (W / 2) + norm * bottomSpread;

        ctx.beginPath();
        ctx.moveTo(xTop, 0);
        ctx.lineTo(xBottom, H);
        ctx.stroke();
      }

      // Baris horizontal 4 tingkat dengan transisi lembut
      const numRows = 4;
      gridOffset = (gridOffset + gridSpeed) % 1;

      for (let r = 0; r < numRows; r++) {
        let t = 1 - ((r + gridOffset) / numRows);
        const y = Math.pow(t, 1.4) * H;
        const alpha = 0.14 + 0.16 * t;
        ctx.strokeStyle = `rgba(255, 255, 255, ${alpha})`;

        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(W, y);
        ctx.stroke();
      }

      requestAnimationFrame(drawTrapezoidGrid);
    }
    drawTrapezoidGrid();

    /* =========================================================================
       2. AWAN 3 LAYER (DISESUAIKAN DENGAN TINGGI BAR BARU 135PX)
       ========================================================================= */
    const cloudsLayer = document.getElementById("cloudsLayer");

    // Layer 1: Belakang (Biru Gelap #1c6fe3)
    const darkCloudPath = `
      <svg viewBox="0 0 1140 135" preserveAspectRatio="none">
        <path fill="#1c6fe3" d="
          M 0,135 L 0,56
          Q 36,20 76,50 Q 122,12 174,48 Q 220,24 265,52 Q 315,10 372,44
          Q 422,20 474,52 Q 525,12 580,48 Q 630,24 682,53 Q 738,10 795,44
          Q 845,20 896,52 Q 950,12 1005,48 Q 1052,26 1095,52 Q 1120,36 1140,56
          L 1140,135 Z" />
      </svg>
    `;

    // Layer 2: Tengah (Biru Muda/Sedang #7cc3ff)
    const midCloudPath = `
      <svg viewBox="0 0 1140 135" preserveAspectRatio="none">
        <path fill="#7cc3ff" d="
          M 0,135 L 0,70
          Q 42,34 88,64 Q 138,26 194,62 Q 245,38 296,66 Q 352,24 412,62
          Q 464,34 515,66 Q 570,24 630,62 Q 685,34 738,66 Q 795,24 855,62
          Q 910,38 962,66 Q 1018,26 1074,62 Q 1110,40 1140,70
          L 1140,135 Z" />
      </svg>
    `;

    // Layer 3: Depan (Putih Terang & Besar #ffffff)
    const lightCloudPath = `
      <svg viewBox="0 0 1140 135" preserveAspectRatio="none">
        <path fill="#ffffff" d="
          M 0,135 L 0,84
          Q 40,46 82,76 Q 130,36 184,74 Q 235,50 284,78 Q 338,34 398,72
          Q 450,48 502,78 Q 558,36 616,74 Q 670,48 724,78 Q 780,34 838,72
          Q 892,48 946,78 Q 1000,36 1056,74 Q 1100,50 1140,84
          L 1140,135 Z" />
      </svg>
    `;

    function createSeamlessCloudLayer(className, svgMarkup) {
      const strip = document.createElement("div");
      strip.className = `cloud-strip ${className}`;
      strip.innerHTML = svgMarkup + svgMarkup;
      cloudsLayer.appendChild(strip);
    }

    createSeamlessCloudLayer("layer-dark", darkCloudPath);
    createSeamlessCloudLayer("layer-mid", midCloudPath);
    createSeamlessCloudLayer("layer-light", lightCloudPath);

    /* =========================================================================
       3. BINTANG JATUH DIAGONAL SEARAH & SIKLUS WAKTU TANPA AWAN
       ========================================================================= */
    const meteorCanvas = document.getElementById("meteorCanvas");
    const mCtx = meteorCanvas.getContext("2d");

    const ANGLE = Math.PI * 0.16;
    const COS_A = Math.cos(ANGLE);
    const SIN_A = Math.sin(ANGLE);

    let meteors = [];
    const MAX_METEORS = 9;          // batas keras, tidak akan pernah lebih dari ini
    let lastFrameTime = performance.now();

    function spawnMeteor(delayMs = 0) {
      if (meteors.length >= MAX_METEORS) return;
      meteors.push({
        x: 200 + Math.random() * 1050,
        y: -15 - Math.random() * 50,
        speed: 9 + Math.random() * 4.5,       // px per frame @60fps
        tailLength: 130 + Math.random() * 90,
        headRadius: 2.6 + Math.random() * 1.4,
        delay: delayMs                          // dalam frame
      });
    }

    function launchMeteorWave() {
      // jangan tambah gelombang baru kalau tab tersembunyi / masih ada meteor tersisa
      if (document.hidden || meteors.length > 0) return;
      for (let i = 0; i < 9; i++) {
        spawnMeteor(i * 18);
      }
    }

    function updateAndDrawMeteors(now) {
      const dt = 1; // per-frame, sama seperti versi asli

      mCtx.clearRect(0, 0, W, H);

      for (let i = meteors.length - 1; i >= 0; i--) {
        const m = meteors[i];
        if (m.delay > 0) {
          m.delay--;
          continue;
        }

        m.x -= COS_A * m.speed * dt;
        m.y += SIN_A * m.speed * dt;

        const tailX = m.x + COS_A * m.tailLength;
        const tailY = m.y - SIN_A * m.tailLength;

        mCtx.save();

        // Glow Biru di Sekeliling Ekor Bintang Jatuh
        const outerGrad = mCtx.createLinearGradient(m.x, m.y, tailX, tailY);
        outerGrad.addColorStop(0, "rgba(165, 225, 255, 0.85)");
        outerGrad.addColorStop(0.35, "rgba(75, 160, 255, 0.45)");
        outerGrad.addColorStop(1, "rgba(20, 90, 220, 0)");

        mCtx.strokeStyle = outerGrad;
        mCtx.lineWidth = m.headRadius * 3.2;
        mCtx.lineCap = "round";
        mCtx.beginPath();
        mCtx.moveTo(m.x, m.y);
        mCtx.lineTo(tailX, tailY);
        mCtx.stroke();

        // Inti Ekor Putih-Biru Muda
        const coreGrad = mCtx.createLinearGradient(m.x, m.y, tailX, tailY);
        coreGrad.addColorStop(0, "rgba(255, 255, 255, 1)");
        coreGrad.addColorStop(0.25, "rgba(215, 242, 255, 0.9)");
        coreGrad.addColorStop(1, "rgba(120, 195, 255, 0)");

        mCtx.strokeStyle = coreGrad;
        mCtx.lineWidth = m.headRadius * 1.15;
        mCtx.beginPath();
        mCtx.moveTo(m.x, m.y);
        mCtx.lineTo(tailX, tailY);
        mCtx.stroke();

        // Kepala Bintang Jatuh Bercahaya (Glowing Head)
        const headGlow = mCtx.createRadialGradient(m.x, m.y, 0, m.x, m.y, m.headRadius * 4.5);
        headGlow.addColorStop(0, "rgba(255, 255, 255, 1)");
        headGlow.addColorStop(0.4, "rgba(195, 235, 255, 0.85)");
        headGlow.addColorStop(1, "rgba(100, 180, 255, 0)");

        mCtx.fillStyle = headGlow;
        mCtx.beginPath();
        mCtx.arc(m.x, m.y, m.headRadius * 4.5, 0, Math.PI * 2);
        mCtx.fill();

        mCtx.restore();

        if (m.y - m.tailLength > H + 35 || m.x + m.tailLength < -50) {
          meteors.splice(i, 1);
        }
      }

      requestAnimationFrame(updateAndDrawMeteors);
    }
    requestAnimationFrame(updateAndDrawMeteors);

    // Saat tab/source disembunyikan lalu muncul lagi: buang semua meteor yang tertumpuk
    document.addEventListener("visibilitychange", () => {
      meteors.length = 0;
      lastFrameTime = performance.now();
    });

    // Siklus: Ada Awan -> Tanpa Awan + Bintang Jatuh Diagonal -> Ada Awan Lagi
    function runCloudAndMeteorCycle() {
      const CLOUD_SHOW_DURATION = 8000;
      const NO_CLOUD_DURATION = 4800;

      setTimeout(() => {
        cloudsLayer.classList.add("clouds-hidden");

        setTimeout(() => {
          launchMeteorWave();
        }, 600);

        setTimeout(() => {
          cloudsLayer.classList.remove("clouds-hidden");
          meteors.length = 0;
          runCloudAndMeteorCycle();
        }, NO_CLOUD_DURATION);

      }, CLOUD_SHOW_DURATION);
    }
    runCloudAndMeteorCycle();

    /* =========================================================================
       4. GENERATE FLAKES BERVARIASI (36 PARTIKEL)
       ========================================================================= */
    const flakesLayer = document.getElementById("flakesLayer");
    const flakeTypes = [
      "flake-dark-square",
      "flake-dark-square",
      "flake-light-square",
      "flake-diamond",
      "flake-cross"
    ];

    for (let i = 0; i < 36; i++) {
      const flake = document.createElement("div");
      const typeClass = flakeTypes[i % flakeTypes.length];
      flake.className = `flake-item ${typeClass}`;
      flake.style.left = (Math.random() * 97 + 1.5) + "%";
      
      const scale = 0.8 + Math.random() * 0.55;
      flake.style.zoom = scale;

      flake.style.animationDuration = (2.4 + Math.random() * 2.5) + "s";
      flake.style.animationDelay = (-Math.random() * 4.5) + "s";
      flakesLayer.appendChild(flake);
    }

    /* =========================================================================
       5. SPARKLES (KILAUAN BINTANG KECIL BERKEDIP)
       ========================================================================= */
    const streamBar = document.getElementById("streamBar");
    const sparkleLocations = [
      { left: "9%", top: "22%", delay: "0s" },
      { left: "24%", top: "74%", delay: "0.4s" },
      { left: "44%", top: "16%", delay: "1.1s" },
      { left: "63%", top: "75%", delay: "0.8s" },
      { left: "79%", top: "20%", delay: "0.2s" },
      { left: "92%", top: "66%", delay: "1.4s" }
    ];

    sparkleLocations.forEach(pos => {
      const sp = document.createElementNS("http://www.w3.org/2000/svg", "svg");
      sp.setAttribute("viewBox", "0 0 24 24");
      sp.classList.add("sparkle");
      sp.style.width = "16px";
      sp.style.height = "16px";
      sp.style.left = pos.left;
      sp.style.top = pos.top;
      sp.style.animationDelay = pos.delay;
      sp.innerHTML = `<path fill="#ffffff" d="M12 0 L14.5 9.5 L24 12 L14.5 14.5 L12 24 L9.5 14.5 L0 12 L9.5 9.5 Z"/>`;
      streamBar.appendChild(sp);
    });

    /* =========================================================================
       6. ANIMASI TEKS POP-UP & POP-OUT (4 DETIK, PROPORSIONAL DENGAN BAR TINGGI)
       ========================================================================= */
    const slides = [
      {
        text: "Joko/Akun murmer? ada di bio",
        fontSize: "37px"
      },
      {
        text: "Cari server discord asik?",
        fontSize: "41px"
      },
      {
        text: "Santuy Network Aja!!",
        fontSize: "41px"
      },
      {
        text: "Sociabuzz ada di bio yahh",
        fontSize: "41px"
      },
      {
        text: "Enjoy the stream!!",
        fontSize: "44px"
      }
    ];

    const textStage = document.getElementById("textStage");
    let currentIndex = 0;

    function runSlide(index) {
      const slide = slides[index];
      textStage.innerHTML = "";

      const words = slide.text.split(" ");
      let charCount = 0;
      const staggerInMs = 30;

      words.forEach(wordText => {
        const wordEl = document.createElement("span");
        wordEl.className = "word";

        for (const ch of wordText) {
          const charEl = document.createElement("span");
          charEl.className = "char pop-in";
          charEl.style.fontSize = slide.fontSize;
          charEl.textContent = ch;
          charEl.style.animationDelay = (charCount * staggerInMs) + "ms";
          wordEl.appendChild(charEl);
          charCount++;
        }
        textStage.appendChild(wordEl);
      });

      const totalPopInTime = (charCount * staggerInMs) + 360;
      const holdDuration = 4000;

      setTimeout(() => {
        const chars = Array.from(textStage.querySelectorAll(".char"));
        const totalChars = chars.length;
        const staggerOutMs = 14;

        chars.forEach((charEl, i) => {
          const reverseIdx = (totalChars - 1) - i;
          charEl.style.animationDelay = (reverseIdx * staggerOutMs) + "ms";
          charEl.classList.remove("pop-in");
          charEl.classList.add("pop-out");
        });

        const totalPopOutTime = (totalChars * staggerOutMs) + 280;

        setTimeout(() => {
          currentIndex = (currentIndex + 1) % slides.length;
          runSlide(currentIndex);
        }, totalPopOutTime + 320);

      }, totalPopInTime + holdDuration);
    }

    runSlide(currentIndex);
  </script>
</body>
